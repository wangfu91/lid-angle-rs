[package]
name = "lid-angle-rs"
version = "0.1.0"
edition = "2021"
authors = ["wangfu91"]
description = "A Rust CLI tool to display real-time MacBook lid angle"
license = "MIT"

[[bin]]
name = "lid-angle"
path = "src/main.rs"

[dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
